<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المدير | لعبتنا</title><link rel="stylesheet" href="styles.css"></head><body class="admin-body"><div id="login" class="login"><div class="login-card"><div class="logo">🎮 لعبتنا</div><h1>دخول المدير</h1><p>لوحة التحكم الخاصة بمالك الموقع</p><input id="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button class="btn primary wide" onclick="adminLogin()">دخول</button><small>نسخة تجريبية: admin@l3btna.local / 123456</small></div></div>
<aside id="sidebar" class="sidebar hidden"><div class="logo">🎮 لعبتنا</div><div class="admin-name">👑 مدير الموقع<small>Super Admin</small></div><a class="side-active" href="admin.html">📊 الرئيسية</a><a href="#gamesAdmin">🎮 الألعاب</a><a href="#orders">💳 الطلبات</a><a href="#roomsAdmin">🏠 الغرف</a><button class="side-link" onclick="logout()">↩ تسجيل الخروج</button></aside>
<main id="dashboard" class="dashboard hidden"><div class="dash-head"><div><span class="muted">لوحة التحكم</span><h1>أهلًا بك 👋</h1></div><button class="btn primary" onclick="showAddGame()">+ إضافة لعبة</button></div><div class="metrics"><div><small>المبيعات</small><strong id="sales">0 ر.س</strong></div><div><small>المشتريات</small><strong id="purchases">0</strong></div><div><small>الألعاب</small><strong id="gameCount">0</strong></div><div><small>الغرف</small><strong id="roomCount">0</strong></div></div>
<section id="gamesAdmin" class="panel admin-panel"><div class="section-head"><h2>إدارة الألعاب</h2></div><div id="adminGames"></div></section>
<section id="orders" class="panel admin-panel"><div class="section-head"><h2>آخر المشتريات</h2></div><div id="ordersList"></div></section>
<section id="roomsAdmin" class="panel admin-panel"><div class="section-head"><h2>الغرف</h2></div><div id="roomsList"></div></section></main>
<div id="modal" class="modal hidden"><div class="modal-card"><h2 id="modalTitle">إضافة لعبة</h2><input id="gName" placeholder="اسم اللعبة"><textarea id="gDesc" placeholder="وصف اللعبة"></textarea><input id="gPrice" type="number" placeholder="السعر"><input id="gPlayers" placeholder="عدد اللاعبين، مثال 3–8"><div class="modal-actions"><button class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary" onclick="saveGame()">حفظ ونشر</button></div></div></div><script src="app.js"></script></body></html>
